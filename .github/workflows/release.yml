name: Release
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          submodules: true

      - uses: Swatinem/rust-cache@v2

      - name: Dependencies
        run: ./.github/workflows/release-deps.sh

      - name: Build
        run: ./.github/workflows/release-build.sh

      - name: Release
        run: ./.github/workflows/release.sh
